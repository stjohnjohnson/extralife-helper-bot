version: '3.8'

services:
  extralife-helper-bot:
    build: .
    container_name: extralife-helper-bot
    env_file: .env
    restart: unless-stopped
    volumes:
      - stream-avatars-state:/usr/src/app/data/stream-avatars
      # Mount the app for development (optional)
      # - ./app.js:/usr/src/app/app.js:ro
    # Shared listener for the voice overlay and Stream Avatars; restrict LAN access.
    ports:
      - "3000:3000"

volumes:
  stream-avatars-state:
