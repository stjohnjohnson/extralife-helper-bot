name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Lua companion test runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run lint
      - run: npm test
        env:
          LUA_BIN: lua5.4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: extralife-helper-bot:latest

  lua-compatibility:
    name: Lua 5.2 companion contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Lua 5.2 test runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.2
      - run: npm ci
      - name: Run shipped companion contracts and mutation checks
        run: npm test -- --runInBand --coverage=false --runTestsByPath tests/streamAvatarsCompanion.test.js
        env:
          LUA_BIN: lua5.2
