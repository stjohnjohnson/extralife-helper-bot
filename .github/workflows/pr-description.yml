name: PR metadata

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-description:
    name: PR description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run pr:check -- --event "$GITHUB_EVENT_PATH"
      - name: Preview release notes
        run: npm run release:preview -- --from "$(git describe --tags --abbrev=0 origin/main)" --to HEAD --candidate-event "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
